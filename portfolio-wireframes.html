<!doctype html>
<html lang="es">
<head>

<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }

  body { font-family: 'Kalam', cursive; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wireframes-shared.jsx"></script>
<script type="text/babel" src="wf1-terminal.jsx"></script>
<script type="text/babel" src="wf2-editorial.jsx"></script>
<script type="text/babel" src="wf3-corporate.jsx"></script>
<script type="text/babel" src="wf4-hybrid.jsx"></script>
<script type="text/babel" src="wf5-manual.jsx"></script>

<script type="text/babel">

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="intro"
        title="Portfolio · Florencia Sombra"
        subtitle="5 direcciones de wireframe lo-fi · contenido bilingüe ES/EN ya redactado · click para ampliar cualquier artboard"
      >
        <DCArtboard id="wf1" label="01 · Terminal / Mainframe" width={580} height={1900}>
          <WF1_Terminal />
        </DCArtboard>

        <DCArtboard id="wf2" label="02 · Editorial / Tipográfico" width={600} height={1900}>
          <WF2_Editorial />
        </DCArtboard>

        <DCArtboard id="wf3" label="03 · Corporate moderno" width={580} height={1900}>
          <WF3_Corporate />
        </DCArtboard>

        <DCArtboard id="wf4" label="04 · Híbrido editorial + terminal" width={600} height={2100}>
          <WF4_Hybrid />
        </DCArtboard>

        <DCArtboard id="wf5" label="05 · Manual técnico (IBM Redbook)" width={580} height={2400}>
          <WF5_Manual />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="notas"
        title="Notas de diseño y próximos pasos"
        subtitle="después de elegir dirección"
      >
        <DCArtboard id="readme" label="README — para el manager" width={520} height={620}>
          <div style={{
            padding: "26px 28px",
            background: "#fefdf8",
            fontFamily: "'Kalam', cursive",
            color: "#1a1a1a",
            lineHeight: 1.55,
            fontSize: 13,
            height: "100%",
          }}>
            <div style={{ fontFamily: "'Caveat', cursive", fontSize: 32, fontWeight: 700, lineHeight: 1, marginBottom: 6 }}>
              Cómo leer este canvas
            </div>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9, color: "#777", letterSpacing: 1, marginBottom: 16 }}>
              FLOR125 · WIREFRAMES · v1.0 · ABR 2026
            </div>

            <div style={{ marginBottom: 14 }}>
              <span style={{ fontWeight: 700 }}>Insight del CV:</span> tu diferenciador principal es el <span style={{ background: "#fff3a3", padding: "0 3px" }}>despliegue real en IBM LinuxONE (s390x)</span> — único de la cohorte, expuesto a tráfico de internet, con logs que bloquearon ataques reales. Eso es lo que un recruiter de IBM/Kyndryl/banca <span style={{ fontStyle: "italic" }}>nunca ve</span> en perfiles junior. Por eso vive en el hero de las 5 direcciones.
            </div>

            <div style={{ marginBottom: 14 }}>
              <span style={{ fontWeight: 700 }}>Las 5 direcciones:</span>
              <div style={{ marginTop: 6, paddingLeft: 14 }}>
                <div><span style={{ color: "#0a7a3a", fontWeight: 700 }}>01 Terminal</span> — credibilidad técnica máxima, riesgo: gimmicky.</div>
                <div><span style={{ color: "#8a2727", fontWeight: 700 }}>02 Editorial</span> — autoridad sobria, lee como Bloomberg/NYT tech.</div>
                <div><span style={{ color: "#1f3d6e", fontWeight: 700 }}>03 Corporate</span> — formato más leído por recruiters de banca.</div>
                <div><span style={{ color: "#0a7a3a", fontWeight: 700 }}>04 Híbrido</span> — <span style={{ background: "#fff3a3", padding: "0 3px" }}>mi recomendación</span>: hero editorial + secciones técnicas en terminal.</div>
                <div><span style={{ color: "#0f4c81", fontWeight: 700 }}>05 Manual IBM</span> — denso, perfecto si querés transmitir "soy parte del ecosistema IBM".</div>
              </div>
            </div>

            <div style={{ marginBottom: 14 }}>
              <span style={{ fontWeight: 700 }}>Copy:</span> ya está redactado en español formal y traducido a inglés. Lo viste en cada wireframe — el toggle ES/EN es real en hi-fi.
            </div>

            <div style={{ marginBottom: 14 }}>
              <span style={{ fontWeight: 700 }}>Próximos pasos:</span>
              <div style={{ marginTop: 4, paddingLeft: 14 }}>
                <div>1. Elegí 1 dirección (o pedí mezclar).</div>
                <div>2. Paso a hi-fi con CSS, transiciones smooth, scroll reveals, fonts reales y easter egg COBOL.</div>
                <div>3. Sumamos diagrama de arquitectura real, foto, captures.</div>
              </div>
            </div>

            <div style={{ marginTop: 18, paddingTop: 12, borderTop: "1px dashed #1a1a1a55", fontFamily: "'Caveat', cursive", fontSize: 16 }}>
              Decime cuál te llama y avanzamos. ✶
            </div>
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
